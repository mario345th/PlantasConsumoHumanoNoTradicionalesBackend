spring.application.name=catalogo-botanico

# ---- Servidor ----
server.port=8080

# ---- Fuente de datos ----
spring.datasource.url=jdbc:postgresql://localhost:5432/florav1
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
# ---- Eso significa que al arrancar, Hibernate compara cada @Entity contra la base real. Si algo no coincide, la aplicación no arranca ----

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ---- Flyway
# Las migraciones en db/migration/ se aplican automáticamente al arrancar.
# baseline-version=3 porque V2 y V3 ya fueron aplicadas manualmente Y NUNCA SE DEBE CAMBIAR A MENOS DE UN CASO MUY NECESARIO.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

# ---- Swagger / OpenAPI ----
# Activo en desarrollo. Para despliegue en producción, desactivar con
# springdoc.api-docs.enabled=false y springdoc.swagger-ui.enabled=false
# mediante un perfil (application-prod.properties).
# ---- Errores ----
# DevTools las activa por defecto; nunca exponer detalles internos en respuestas
server.error.include-stacktrace=never
server.error.include-message=never

# ---- Correo (recuperación de clave) ----
# Cuenta de Gmail dedicada al proyecto (no la cuenta personal de nadie del
# equipo). MAIL_USERNAME/MAIL_PASSWORD son variables de entorno: la clave es
# una "contraseña de aplicación" de Gmail, no la contraseña normal de la
# cuenta. No se escriben aquí para no subirlas al repositorio.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# El remitente que ve el usuario es la misma cuenta autenticada arriba.
app.recuperacion-clave.remitente=${MAIL_USERNAME:}
# URL del frontend que lee el parametro ?token= y muestra el formulario
# para la clave nueva. Cambiar cuando el frontend tenga su dominio real.
app.recuperacion-clave.url-base=http://localhost:5173/restablecer-clave
app.recuperacion-clave.expiracion-minutos=30

# ---- JWT (autenticacion) ----
# Clave simetrica con la que se firman y verifican los tokens (HS256).
# En produccion SE DEBE sobrescribir con la variable de entorno JWT_SECRET: el
# valor de abajo es un marcador de desarrollo y esta en el repositorio, asi que
# cualquiera que lo lea puede firmar tokens validos.
# HS256 exige una clave de al menos 256 bits (32 bytes en UTF-8); el arranque
# falla con un mensaje explicito si el secreto es mas corto.
app.jwt.secret=${JWT_SECRET:flora-ues-fmp-secreto-de-desarrollo-cambiar-en-produccion-2026}

# Vigencia del token en minutos. Corta a proposito: los roles viajan dentro del
# token, asi que desactivar un rol no surte efecto hasta que el token expire.
app.jwt.expiration-minutes=60
